name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  # Rubies that can use the checked-in Gemfile.lock.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  # The gemspec supports Ruby >= 2.7, but Gemfile.lock pins a Bundler that
  # requires >= 3.1. Resolve dependencies fresh on the older Rubies so the
  # support claim stays tested rather than merely advertised.
  test-legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: "2.7"
            bundler: "2.4.22"
          - ruby-version: "3.0"
            bundler: "2.4.22"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: false

      - name: Resolve dependencies without the checked-in lockfile
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: bundle exec rake test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build the gem
        run: gem build typst-rails.gemspec

      # No --local: the gem's runtime dependencies still have to come from
      # rubygems.org, and --local would refuse to fetch them.
      - name: Install the built gem
        run: gem install --no-document typst-rails-*.gem

      - name: Smoke test the installed gem
        run: ruby -e 'require "typst_rails"; puts TypstRails::VERSION'
